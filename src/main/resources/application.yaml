spring:
  application:
    name: LeaveBookingSystem
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

server:
  server-header: ""

rabbitmq:
  enabled: ${RABBITMQ_ENABLED:false}
  outbox:
    recovery:
      enabled: ${RABBITMQ_OUTBOX_RECOVERY_ENABLED:true}
      fixed-delay: ${RABBITMQ_OUTBOX_RECOVERY_DELAY:30000}
      batch-size: ${RABBITMQ_OUTBOX_RECOVERY_BATCH_SIZE:50}
      max-attempts: ${RABBITMQ_OUTBOX_RECOVERY_MAX_ATTEMPTS:5}
    retry:
      max-attempts: 3
      initial-delay: 500
      multiplier: 2.0
    bindings:
      "[uk.ac.staffs.leavebooking.common.events.integration.LeaveRequestSubmittedIntegrationEvent]":
        exchange: leave.events
        routing-key: leave.request.submitted
      "[uk.ac.staffs.leavebooking.common.events.integration.LeaveRequestApprovedIntegrationEvent]":
        exchange: leave.events
        routing-key: leave.request.approved
      "[uk.ac.staffs.leavebooking.common.events.integration.LeaveRequestRejectedIntegrationEvent]":
        exchange: leave.events
        routing-key: leave.request.rejected
      "[uk.ac.staffs.leavebooking.common.events.integration.LeaveRequestCancelledIntegrationEvent]":
        exchange: leave.events
        routing-key: leave.request.cancelled
      "[uk.ac.staffs.leavebooking.common.events.integration.SickLeaveRecordedIntegrationEvent]":
        exchange: leave.events
        routing-key: leave.sick.recorded
      "[uk.ac.staffs.leavebooking.common.events.integration.LeaveRequestReferredForHrApprovalIntegrationEvent]":
        exchange: leave.events
        routing-key: leave.request.referred-hr
  consumer:
    retry:
      max-attempts: 3
      initial-delay: 500
      multiplier: 2.0
      max-delay: 2000

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:leave-booking-system-f4e37}
  web-api-key: ${FIREBASE_WEB_API_KEY:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  login:
    capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
    window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
  api:
    capacity: ${RATE_LIMIT_API_CAPACITY:60}
    window-seconds: ${RATE_LIMIT_API_WINDOW_SECONDS:60}

logging:
  file:
    name: ${APP_LOG_FILE:logs/leave-booking-system.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 70MB
